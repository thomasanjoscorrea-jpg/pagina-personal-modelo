<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07191c">
<meta name="color-scheme" content="dark">
<title>Rafael Almeida | Personal Trainer</title>
<meta name="description" content="Conheça o personal trainer, veja os pacotes e onde ele atende. Fale pelo WhatsApp.">
<meta property="og:title" content="Rafael Almeida | Personal Trainer">
<meta property="og:description" content="Conheça os pacotes e onde atendo. Fale pelo WhatsApp.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff5b1f'/%3E%3Cpath d='M7 12h3v8H7zM22 12h3v8h-3zM10 14h2v4h-2zM20 14h2v4h-2zM12 15h8v2h-8z' fill='%231a0a03'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040e10; --ink:#07191c; --ink2:#0c2529; --ink3:#12333a; --line:rgba(255,255,255,.14);
  --chalk:#f3f6f6; --mut:#9db3b6; --o:#ff5b1f; --o-ink:#1a0a03; --pad:20px;
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,a,summary{touch-action:manipulation}
:focus-visible{outline:3px solid var(--o);outline-offset:3px;border-radius:6px}
.page{max-width:560px;margin:0 auto;background:var(--ink);min-height:100svh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom));box-shadow:0 0 80px rgba(0,0,0,.5)}
.d{font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:.92}
.demo{background:#2a1a0e;color:#ffc9a8;text-align:center;font-size:12.5px;padding:7px 14px}

/* capa */
.cover{position:relative;height:clamp(430px,74svh,620px);display:flex;align-items:flex-end;padding:0 var(--pad) 30px;overflow:hidden;isolation:isolate}
.cover-bg{position:absolute;inset:0;background:var(--ink3) center 18%/cover no-repeat;z-index:-2;animation:settle 2.2s cubic-bezier(.2,.7,.2,1) both}
.cover::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,25,28,.25) 0%,rgba(7,25,28,0) 30%,rgba(7,25,28,.82) 72%,var(--ink) 100%)}
.status{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#7f9396}
.dot.on{background:#3ddc84;box-shadow:0 0 0 5px rgba(61,220,132,.22)}
.cover h1{font-size:clamp(60px,18vw,92px)}
.ln{display:block;overflow:hidden;padding:.02em 0 .05em}
.ln>span{display:block;animation:rise 1s cubic-bezier(.16,1,.3,1) both}
.ln:nth-child(2)>span{animation-delay:.12s}
.cover .tag{color:#d3e0e1;margin-top:12px;max-width:34ch;animation:fade .9s .55s both}
@keyframes settle{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:12px;font-weight:800;font-size:16px;border:1.5px solid transparent;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.btn svg{width:22px;height:22px;flex:none}
.btn:active{transform:scale(.97)}
.btn-o{background:var(--o);color:var(--o-ink)}
.btn-l{border-color:rgba(255,255,255,.32);color:var(--chalk)}
.blk{width:100%}
@media(hover:hover) and (pointer:fine){.btn-o:hover{background:#ff7340}.btn-l:hover{border-color:var(--o);color:var(--o)}}
.actions{display:grid;gap:10px;padding:0 var(--pad)}
.meta{padding:16px var(--pad) 0;display:flex;flex-wrap:wrap;font-size:13.5px;color:var(--mut)}
.meta span+span{margin-left:14px;padding-left:14px;border-left:1px solid var(--line)}

/* blocos */
section{padding:56px var(--pad) 0}
h2.d{font-size:clamp(44px,12vw,60px);margin-bottom:16px}
.about p{color:#d3e0e1;margin-bottom:14px}
.ticks{list-style:none;margin-top:18px;border-top:1px solid var(--line)}
.ticks li{padding:12px 0 12px 32px;border-bottom:1px solid var(--line);position:relative;font-weight:600}
.ticks li::before{content:"";position:absolute;left:4px;top:18px;width:12px;height:7px;border-left:3px solid var(--o);border-bottom:3px solid var(--o);transform:rotate(-45deg)}
.sub{color:var(--mut);margin:-4px 0 22px}

/* pacotes */
.packs{display:grid;gap:14px}
.pack{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:26px 22px;position:relative}
.pack.hot{border:2px solid var(--o);background:linear-gradient(180deg,rgba(255,91,31,.1),var(--ink2) 55%)}
.badge{position:absolute;top:-13px;left:20px;background:var(--o);color:var(--o-ink);font-weight:800;font-size:13px;border-radius:99px;padding:4px 14px}
.pack h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:36px;line-height:1}
.pack .for{color:var(--mut);font-size:14.5px;margin:6px 0 14px}
.pack ul{list-style:none;margin-bottom:20px}
.pack li{padding:8px 0 8px 26px;position:relative;font-size:15px;border-top:1px solid var(--line)}
.pack li::before{content:"";position:absolute;left:3px;top:13px;width:11px;height:6px;border-left:3px solid var(--o);border-bottom:3px solid var(--o);transform:rotate(-45deg)}

/* local */
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--ink2)}
.box .in{padding:22px}
.box h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:34px;line-height:1}
.addr{color:var(--mut);margin:6px 0 16px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:10px 0;border-top:1px solid var(--line)}
.hours td:last-child{text-align:right;color:var(--mut)}
.hours tr.today td{color:var(--o);font-weight:800}
.obs{color:var(--mut);font-size:13.5px;margin-top:12px}
.map{display:block;width:100%;height:250px;border:0;filter:grayscale(.7) contrast(1.05) brightness(.9)}
.box .go{padding:18px 22px 22px}

footer{padding:40px var(--pad) 0;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--chalk);text-decoration:underline;text-underline-offset:3px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,25,28,0),rgba(7,25,28,.94) 45%);pointer-events:none}
.bar{transition:opacity .3s,transform .3s}
.bar.hide{opacity:0;transform:translateY(20px)}
.bar.hide .btn{pointer-events:none}
.bar .btn{pointer-events:auto;width:100%;max-width:528px;margin:0 auto;display:flex;box-shadow:0 10px 30px rgba(255,91,31,.35)}

.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cover-bg,.ln>span,.cover .tag{animation:none}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
/* =====================================================
   EDITE SÓ ESTE BLOCO PARA CADA PERSONAL
   (dados FICTÍCIOS: servem só para a prévia)
   ===================================================== */
const P = {
  demo: true,                      // true = mostra a faixa "prévia"; use false na página real
  nome: "Rafael Almeida",
  cref: "CREF 000000-G/PR",
  nomeLinhas: ["Rafael", "Almeida"],
  tagline: "Personal trainer. Treino individualizado e acompanhamento de perto.",
  foto: "",                        // foto REAL do personal ("foto.jpg" ou link). Se preencher, substitui a de exemplo
  fotoExemplo: "photo-1758875568932-0eefd3e60090",   // foto de banco (Unsplash) só para a prévia; apague na página real
  whatsapp: "5544999999999",       // DDI + DDD + número, só dígitos
  instagram: "rafael.personal",
  cidade: "Mandaguari - PR",
  sobreTitulo: "Quem sou eu",
  sobre: [
    "Sou personal trainer e acompanho cada aluno de perto: avalio, monto o treino para o seu objetivo e ajusto a cada semana.",
    "Seja para emagrecer, ganhar massa ou voltar a se movimentar com segurança, o plano é feito para a sua rotina."
  ],
  destaques: ["Avaliação física inicial", "Treino individualizado", "Suporte pelo WhatsApp", "Ajustes constantes no plano"],
  /* Sem preços: só o nome do pacote */
  pacotes: [
    { nome: "Pacote Comum",  perfil: "Para começar com orientação profissional.",
      itens: ["2 treinos por semana", "Avaliação física inicial", "Treino individualizado"] },
    { nome: "Pacote Plus",   perfil: "Acompanhamento mais próximo e evolução mais rápida.", destaque: "Mais escolhido",
      itens: ["3 a 5 treinos por semana", "Reavaliação mensal", "Ajustes constantes no plano", "Suporte prioritário no WhatsApp"] },
    { nome: "Pacote Online", perfil: "Treine onde estiver, com o plano no celular.",
      itens: ["Planilha de treino personalizada", "Vídeos de execução", "Suporte pelo WhatsApp"] }
  ],
  local: {
    nome: "Studio Movimento",
    endereco: "Rua Exemplo, 123 - Centro, Mandaguari - PR",
    obs: "Também atendo em domicílio na região.",
    horarios: [
      { label: "Segunda a sexta", dias: [1,2,3,4,5], de: "06:00", ate: "20:00" },
      { label: "Sábado",          dias: [6],         de: "07:00", ate: "11:00" },
      { label: "Domingo",         dias: [0],         fechado: true }
    ]
  }
};
/* ===================================================== */

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first = P.nome.split(/\s+/)[0];
const wa = t => `https://wa.me/${P.whatsapp}?text=${encodeURIComponent(t)}`;
const cover = P.foto || (P.fotoExemplo ? `https://images.unsplash.com/${P.fotoExemplo}?auto=format&fit=crop&w=1000&h=1300&q=70` : "");
const mq = encodeURIComponent(P.local.endereco);
const WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.27-1.4A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.13.83.84-3.05-.2-.31a8.2 8.2 0 1 1 7 3.86Zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.12-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.54.06a6.7 6.7 0 0 1-3.3-2.88c-.25-.43.25-.4.72-1.34.08-.16.04-.3-.02-.43-.06-.12-.56-1.35-.76-1.85-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.3-.23.25-.86.84-.86 2.05s.88 2.38 1 2.55c.12.16 1.73 2.64 4.2 3.7 1.56.67 2.17.73 2.95.62.48-.07 1.46-.6 1.67-1.17.2-.58.2-1.07.14-1.17-.06-.1-.23-.16-.48-.28Z"/></svg>';
document.title = `${P.nome} | Personal Trainer`;

document.getElementById("app").innerHTML = `
${P.demo ? `<div class="demo">Prévia: nome, endereço e foto são exemplos.</div>` : ""}
<header class="cover">
  <div class="cover-bg" ${cover?`style="background-image:url('${esc(cover)}')"`:""} role="img" aria-label="Foto de ${esc(P.nome)}"></div>
  <div>
    <p class="status"><span class="dot" id="dot"></span><span id="openTxt">Atendimento</span></p>
    <h1 class="d">${P.nomeLinhas.map(l=>`<span class="ln"><span>${esc(l)}</span></span>`).join("")}</h1>
    <p class="tag">${esc(P.tagline)}</p>
  </div>
</header>

<div class="actions">
  <a class="btn btn-o" href="${wa(`Olá, ${first}! Vim pelo seu Instagram e quero saber mais sobre o treino.`)}">${WA} Chamar no WhatsApp</a>
  ${P.instagram?`<a class="btn btn-l" target="_blank" rel="noopener" href="https://instagram.com/${esc(P.instagram)}">Instagram @${esc(P.instagram)}</a>`:""}
</div>
<p class="meta">${P.cref?`<span>${esc(P.cref)}</span>`:""}<span>${esc(P.cidade)}</span></p>

<section class="about rv">
  <h2 class="d">${esc(P.sobreTitulo)}</h2>
  ${P.sobre.map(t=>`<p>${esc(t)}</p>`).join("")}
  <ul class="ticks">${P.destaques.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
</section>

<section class="rv">
  <h2 class="d">Meus pacotes</h2>
  <p class="sub">Os valores variam conforme a frequência e o objetivo. Toque em um pacote e eu passo as condições.</p>
  <div class="packs">${P.pacotes.map(k=>`
    <article class="pack ${k.destaque?"hot":""}">
      ${k.destaque?`<span class="badge">${esc(k.destaque)}</span>`:""}
      <h3>${esc(k.nome)}</h3><p class="for">${esc(k.perfil)}</p>
      <ul>${k.itens.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
      <a class="btn ${k.destaque?"btn-o":"btn-l"} blk" href="${wa(`Olá, ${first}! Tenho interesse no ${k.nome}. Pode me passar os valores e como funciona?`)}">Consultar valores</a>
    </article>`).join("")}</div>
</section>

<section class="rv">
  <h2 class="d">Onde eu atendo</h2>
  <div class="box">
    <iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa do local de atendimento" src="https://maps.google.com/maps?q=${mq}&output=embed"></iframe>
    <div class="in">
      <h3>${esc(P.local.nome)}</h3><p class="addr">${esc(P.local.endereco)}</p>
      <table class="hours" id="hours">${P.local.horarios.map((h,i)=>`<tr data-i="${i}"><td>${esc(h.label)}</td><td>${h.fechado?"Fechado":esc(h.de)+" às "+esc(h.ate)}</td></tr>`).join("")}</table>
      ${P.local.obs?`<p class="obs">${esc(P.local.obs)}</p>`:""}
    </div>
    <div class="go"><a class="btn btn-l blk" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${mq}">Como chegar</a></div>
  </div>
</section>

<footer>© ${new Date().getFullYear()} ${esc(P.nome)}${P.cref?", "+esc(P.cref):""}<br>Procure orientação médica antes de iniciar qualquer atividade física.${P.demo?`<br>Foto da prévia: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>.`:""}</footer>

<div class="bar"><a class="btn btn-o" href="${wa(`Olá, ${first}! Vim pelo seu Instagram.`)}">${WA} Falar no WhatsApp</a></div>
`;

/* aberto agora */
(function(){
  const now = new Date(), d = now.getDay(), m = now.getHours()*60 + now.getMinutes();
  const toM = s => { const [h,mi] = s.split(":").map(Number); return h*60+mi; };
  let open = false;
  P.local.horarios.forEach((h,i) => {
    if (h.dias.includes(d)) {
      document.querySelector(`#hours tr[data-i="${i}"]`).classList.add("today");
      if (!h.fechado && m >= toM(h.de) && m < toM(h.ate)) open = true;
    }
  });
  document.getElementById("dot").classList.toggle("on", open);
  document.getElementById("openTxt").textContent = (open ? "Atendendo agora" : "Fora do horário") + ", " + P.cidade;
})();

/* botão fixo só aparece depois que os botões do topo saem da tela */
(function(){
  const bar = document.querySelector(".bar"), top = document.querySelector(".actions");
  if (!("IntersectionObserver" in window)) return;
  bar.classList.add("hide");
  new IntersectionObserver(es => bar.classList.toggle("hide", es[0].isIntersecting)).observe(top);
})();

/* blocos aparecem ao rolar */
(function(){
  const els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .06 });
  els.forEach(e => io.observe(e));
})();
</script>
</body>
</html>
