<style>
:root{
  --ink:#07191c; --ink2:#0c2529; --ink3:#12333a; --line:rgba(255,255,255,.14);
  --chalk:#f3f6f6; --mut:#9db3b6;
  --paper:#f6f8f8; --conc:#e4e8e8; --txt-l:#07191c; --mut-l:#4a5f63; --line-l:rgba(7,25,28,.18);
  --o:#ff5b1f; --o-ink:#1a0a03;
  --pad:clamp(18px,5vw,40px); --sec:clamp(76px,12vw,140px);
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
button,a,summary,[role=button]{touch-action:manipulation}
input{font-size:16px;font-family:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--o);color:var(--o-ink);padding:10px 16px;border-radius:8px;z-index:300;font-weight:700}
.skip:focus{left:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
.d{font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.002em}
h2.d{font-size:clamp(44px,10vw,92px);margin-bottom:18px}
.lead{color:var(--mut);max-width:52ch;font-size:clamp(16px,2vw,18px)}
.lt{background:var(--paper);color:var(--txt-l)} .lt .lead{color:var(--mut-l)}
.cn{background:var(--conc);color:var(--txt-l)} .cn .lead{color:var(--mut-l)}
section{padding:var(--sec) 0;position:relative}
.head{margin-bottom:clamp(34px,6vw,64px)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:12px;font-weight:800;font-size:16px;border:1.5px solid transparent;cursor:pointer;transition:transform .12s ease,background .2s,border-color .2s,color .2s}
.btn svg{width:22px;height:22px;flex:none}
.btn:active{transform:scale(.97)}
.btn-o{background:var(--o);color:var(--o-ink)}
.btn-l{border-color:rgba(255,255,255,.35);color:var(--chalk)}
.btn-d{border-color:var(--ink);color:var(--ink)}
.blk{width:100%}
@media(hover:hover) and (pointer:fine){
  .btn-o:hover{background:#ff7340}
  .btn-l:hover{border-color:var(--o);color:var(--o)}
  .btn-d:hover{background:var(--ink);color:var(--chalk)}
}

/* progresso e nav */
.prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--o);z-index:200}
.demo{background:#2a1a0e;color:#ffc9a8;text-align:center;font-size:13px;padding:8px 14px}
.nav{position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top);transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(7,25,28,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line)}
.nav .in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--disp);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
@media(max-width:640px){.nav .btn{display:none}}
.nav-r{display:flex;align-items:center;gap:10px}
.nav .btn{min-height:44px;padding:0 18px;font-size:14.5px}
.burger{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(7,25,28,.5);display:grid;place-items:center;cursor:pointer}
.burger i{display:block;width:20px;height:2px;background:var(--chalk);box-shadow:0 6px 0 var(--chalk),0 -6px 0 var(--chalk)}
.sheet{position:fixed;inset:0;z-index:150;background:var(--ink);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto}
.sheet.open{display:flex}
.sheet .top{display:flex;justify-content:space-between;align-items:center;height:58px}
.sheet nav{display:grid;margin:18px 0 28px}
.sheet nav a{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(40px,11vw,64px);line-height:1.12;border-bottom:1px solid var(--line);padding:6px 0}
.x{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer;font-size:26px;line-height:1}

/* hero */
.hero{position:relative;min-height:100svh;margin-top:-64px;display:flex;align-items:flex-end;padding:140px 0 clamp(44px,8vw,80px);overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:-6% 0;background-size:cover;background-position:60% 22%;z-index:-2;will-change:transform}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,25,28,.62) 0%,rgba(7,25,28,.1) 30%,rgba(7,25,28,.78) 68%,var(--ink) 100%)}
.hero h1{font-size:clamp(66px,20vw,190px);margin:14px 0 22px}
.ln{display:block;overflow:hidden;padding:.02em 0 .05em}
.ln>span{display:block}
.status{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--chalk)}
.dot{width:9px;height:9px;border-radius:50%;background:#7f9396}
.dot.on{background:#3ddc84;box-shadow:0 0 0 5px rgba(61,220,132,.22)}
.hero .lead{color:#d3e0e1;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta .btn{flex:1 1 220px}
.meta{display:flex;flex-wrap:wrap;margin-top:30px;font-size:13.5px;color:var(--mut)}
.meta span+span{margin-left:16px;padding-left:16px;border-left:1px solid var(--line)}
@media(min-width:960px){
  .hero{align-items:center;padding-top:120px}
  .hero-bg{left:34%;background-position:50% 20%}
  .hero::after{background:linear-gradient(90deg,var(--ink) 36%,rgba(7,25,28,.5) 56%,rgba(7,25,28,0) 100%),linear-gradient(180deg,rgba(7,25,28,.4),rgba(7,25,28,0) 25%,rgba(7,25,28,.55))}
  .hero .in{padding-right:calc(var(--pad) + 42%)}
  .hero h1{font-size:clamp(80px,9.2vw,136px)}
}
html.pre .ln>span{transform:translateY(108%)}
html.pre .fx{opacity:0}

/* faixa */
.mq{background:var(--o);color:var(--o-ink);overflow:hidden;white-space:nowrap;padding:14px 0}
.mq-t{display:inline-flex;animation:mq 34s linear infinite}
.mq span{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:26px;letter-spacing:.03em;padding:0 22px;display:inline-flex;align-items:center;gap:44px}
.mq span::after{content:"";width:9px;height:9px;background:var(--o-ink);transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}

/* sobre */
.sobre .g{display:grid;gap:40px}
.sobre-pic{width:100%;aspect-ratio:4/5;border-radius:6px;background:var(--conc) center/cover no-repeat}
.sobre p{margin-bottom:16px;font-size:clamp(16px,2vw,18px)}
.ticks{list-style:none;margin:22px 0 34px;border-top:1px solid var(--line-l)}
.ticks li{padding:13px 0 13px 34px;border-bottom:1px solid var(--line-l);position:relative;font-weight:600}
.ticks li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:7px;border-left:3px solid var(--o);border-bottom:3px solid var(--o);transform:rotate(-45deg)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 16px;margin-top:34px}
.stat b{display:block;font-family:var(--disp);font-weight:800;font-size:clamp(54px,12vw,76px);line-height:1}
.stat b{color:var(--ink)}
.stat span{color:var(--mut-l);font-size:14px;line-height:1.35;display:block;margin-top:4px}
.tl{margin-top:34px;display:grid;gap:0;border-left:2px solid var(--ink)}
.tl div{padding:0 0 22px 22px;position:relative}
.tl div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;background:var(--o);border-radius:50%}
.tl b{display:block;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.03em}
.tl span{color:var(--mut-l)}
@media(min-width:960px){
  .sobre .g{grid-template-columns:.9fr 1.1fr;gap:80px;align-items:start}
  .sobre-pic{position:sticky;top:96px}
  .stats{grid-template-columns:repeat(4,1fr)}
}

/* método: cartões empilhados */
.metodo{background:var(--ink2)}
.stack{display:grid;gap:22px}
.st{position:sticky;top:calc(84px + var(--i)*16px)}
.st-in{background:var(--ink3);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,5vw,44px);min-height:clamp(220px,34svh,320px);display:grid;gap:10px;align-content:start;transform-origin:50% 0;box-shadow:0 -14px 30px rgba(0,0,0,.28)}
.st .n{font-family:var(--disp);font-weight:900;font-size:clamp(76px,16vw,132px);line-height:.8;color:var(--o)}
.st h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(32px,6vw,52px);line-height:1}
.st p{color:var(--mut);max-width:48ch}
@media(min-width:960px){.st-in{grid-template-columns:150px 1fr;column-gap:30px;align-items:center;min-height:260px}.st .n{grid-row:span 2}}

/* áreas */
.sv{border-top:1px solid var(--line-l)}
.sv:last-child{border-bottom:1px solid var(--line-l)}
.sv summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(32px,7vw,58px);line-height:1}
.sv summary::-webkit-details-marker{display:none}
.sv summary::after{content:"+";font-size:.9em;color:var(--o);transition:transform .25s ease;flex:none}
.sv[open] summary::after{transform:rotate(45deg)}
.sv p{padding:0 0 24px;color:var(--mut-l);max-width:56ch;font-size:17px}

/* galeria e depoimentos: trilho deslizante */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 10px;scroll-padding-left:var(--pad);overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(78%,340px);aspect-ratio:3/4;border-radius:8px;background:var(--ink3) center/cover no-repeat;scroll-snap-align:start;position:relative;overflow:hidden}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(7,25,28,.55))}
.rail-h{display:flex;justify-content:space-between;align-items:end;gap:20px}
.arrows{display:none;gap:8px;margin-bottom:62px}
.arrows button{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;font-size:22px}
@media(hover:hover) and (pointer:fine){.arrows{display:flex}.arrows button:hover{border-color:var(--o);color:var(--o)}}
.hint{color:var(--mut);font-size:14px;padding:6px var(--pad) 0}
.quote{flex:0 0 min(86%,460px);scroll-snap-align:start;border:1px solid var(--line-l);border-radius:var(--r);padding:28px;background:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:26px}
.quote p{font-size:clamp(18px,2.4vw,21px);line-height:1.5;font-weight:600}
.quote b{display:block}.quote span{color:var(--mut-l);font-size:14px}

/* pacotes */
.packs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));align-items:stretch}
.pack{background:#fff;border:1px solid var(--line-l);border-radius:var(--r);padding:30px 24px;display:flex;flex-direction:column;position:relative}
.pack.hot{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.pack.rec{box-shadow:0 0 0 3px var(--o)}
.badge{position:absolute;top:-13px;left:22px;background:var(--o);color:var(--o-ink);font-weight:800;font-size:13px;border-radius:99px;padding:4px 14px}
.pack h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:38px;line-height:1}
.pack .for{color:var(--mut-l);font-size:15px;margin:8px 0 18px}
.pack.hot .for{color:var(--mut)}
.pack ul{list-style:none;margin-bottom:26px;flex:1}
.pack li{padding:10px 0 10px 28px;position:relative;font-size:15px;border-top:1px solid var(--line-l)}
.pack.hot li{border-color:var(--line)}
.pack li::before{content:"";position:absolute;left:3px;top:15px;width:11px;height:6px;border-left:3px solid var(--o);border-bottom:3px solid var(--o);transform:rotate(-45deg)}
.note{color:var(--mut-l);font-size:14.5px;margin-top:22px}

/* quiz (uma pergunta por tela) */
.plano{background:var(--ink)}
.plano .g{display:grid;gap:26px}
.qz,.tool{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,4vw,40px)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:26px}
.bars i{height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.bars i.on{background:var(--o)}
.qq{font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.2;margin-bottom:22px}
.qo{display:grid;gap:10px}
.qo button{min-height:58px;text-align:left;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:17px;cursor:pointer;transition:border-color .15s,background .15s}
.qo button:active{background:rgba(255,91,31,.18);border-color:var(--o)}
@media(hover:hover) and (pointer:fine){.qo button:hover{border-color:var(--o)}}
.back{margin-top:18px;background:none;border:0;color:var(--mut);cursor:pointer;min-height:44px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.res h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(52px,12vw,84px);line-height:.95;color:var(--o);margin-bottom:12px}
.res p{color:#d3e0e1;margin-bottom:22px;max-width:46ch}
.tool h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:38px;line-height:1;margin-bottom:8px}
.tool .lead{font-size:15px;margin-bottom:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.fields label{font-size:14px;color:var(--mut);font-weight:600}
.fields input{display:block;width:100%;margin-top:6px;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--ink);color:var(--chalk);padding:0 14px}
.imc{font-family:var(--disp);font-weight:800;font-size:76px;line-height:1;color:var(--o);margin:20px 0 4px}
.tiny{color:var(--mut);font-size:13px;margin-top:16px}
@media(min-width:960px){.plano .g{grid-template-columns:1.25fr .75fr;align-items:start}}

/* faq */
.fq{border-top:1px solid var(--line-l)}
.fq:last-of-type{border-bottom:1px solid var(--line-l)}
.fq summary{list-style:none;cursor:pointer;padding:22px 0;font-weight:800;font-size:clamp(18px,2.6vw,22px);display:flex;justify-content:space-between;gap:18px;align-items:center}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";font-size:30px;line-height:1;color:var(--o);transition:transform .25s;flex:none}
.fq[open] summary::after{transform:rotate(45deg)}
.fq p{padding:0 0 24px;color:var(--mut-l);max-width:62ch}

/* local */
.local{background:var(--ink2)}
.local .g{display:grid;gap:20px}
.box{border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,4vw,34px);background:var(--ink)}
.box h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:40px;line-height:1}
.box .addr{color:var(--mut);margin:8px 0 22px}
.hours{width:100%;border-collapse:collapse;margin-bottom:20px}
.hours td{padding:11px 0;border-top:1px solid var(--line)}
.hours td:last-child{text-align:right;color:var(--mut)}
.hours tr.today td{color:var(--o);font-weight:800}
.map{width:100%;min-height:340px;height:100%;border:0;border-radius:var(--r);filter:grayscale(.7) contrast(1.05) brightness(.9)}
@media(min-width:960px){.local .g{grid-template-columns:.85fr 1.15fr}}

/* final */
.final{text-align:center;min-height:90svh;display:grid;align-items:center;background:linear-gradient(180deg,rgba(7,25,28,.9),rgba(7,25,28,.72) 50%,rgba(7,25,28,.92)),var(--fbg,var(--ink)) center/cover no-repeat}
.final h2{font-size:clamp(52px,13vw,128px);margin-bottom:20px}
.final .lead{margin:0 auto 30px;color:#d3e0e1}
.final .cta{justify-content:center}.final .cta .btn{flex:0 1 290px}
footer.site{background:var(--ink);border-top:1px solid var(--line);padding:30px 0 calc(110px + env(safe-area-inset-bottom));color:var(--mut);font-size:13.5px;text-align:center}
footer.site a{color:var(--chalk);text-decoration:underline;text-underline-offset:3px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,25,28,0),rgba(7,25,28,.92) 45%)}
.bar .btn{width:100%;max-width:560px;margin:0 auto;display:flex;box-shadow:0 10px 30px rgba(255,91,31,.35)}
@media(min-width:960px){
  .bar{left:auto;right:26px;bottom:26px;padding:0;background:none}
  .bar .btn{width:auto;border-radius:99px;padding:0 28px}
  footer.site{padding-bottom:36px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mq-t{animation:none}}
</style>
<script>
/* some o véu inicial se o motor de animação não carregar */
setTimeout(function(){document.documentElement.classList.remove('pre')},3500);
</script>

<div class="prog" id="prog"></div>
<div id="app"></div>

<script>
/* =====================================================
   EDITE SÓ ESTE BLOCO PARA CADA PERSONAL
   (dados FICTÍCIOS: servem só para a prévia)
   ===================================================== */
const P = {
  demo: true,                      // true = mostra a faixa "prévia"; use false na página real
  nome: "Rafael Almeida",
  cref: "CREF 000000-G/PR",
  headline: ["Treino", "sob medida", "para você"],
  tagline: "Avaliação, treino individualizado e acompanhamento de perto. Do primeiro treino à rotina que fica.",
  foto: "",                        // foto REAL do personal ("foto.jpg" ou link). Se preencher, substitui a do topo
  /* Fotos de banco gratuito (Unsplash) só para a PRÉVIA. Na página real use as fotos do próprio personal
     (ou deixe fotos: {} para mostrar só cores). Valores = código da foto no Unsplash. */
  fotos: {
    hero:  "photo-1758875568932-0eefd3e60090",
    sobre: "photo-1758875569399-99a7d80ace43",
    fundo: "photo-1517838277536-f5f99be501cd",
    galeria: ["photo-1571019614242-c5c5dee9f50b","photo-1534258936925-c58bed479fcb","photo-1758875569256-f37c438cac65","photo-1648542036561-e1d66a5ae2b1"]
  },
  whatsapp: "5544999999999",       // DDI + DDD + número, só dígitos
  instagram: "rafael.personal",
  cidade: "Mandaguari - PR",
  stats: [
    { n: 8,   suf: "+", l: "anos de experiência" },

(function(){

  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Sao_Paulo", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const d = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(get("weekday")), m = Number(get("hour"))*60 + Number(get("minute"));
  const toM = s => { const [h,mi] = String(s).split(":").map(Number); return h*60+(mi||0); };
  let open = false;
  P.local.horarios.forEach((h,i) => {
    if (h.dias.includes(d)) {
      document.querySelector(`#hours tr[data-i="${i}"]`).classList.add("today");
      if (!h.fechado && m >= toM(h.de) && m < toM(h.ate)) open = true;
    }
  });
  document.getElementById("dot").classList.toggle("on", open);
  document.getElementById("openTxt").textContent = [open ? "Atendendo agora" : "Fora do horário", P.cidade].filter(Boolean).join(", ");

/* ---------- quiz: uma pergunta por tela ---------- */
const QS = [
  { k: "obj", q: "Qual é o seu objetivo?",           o: ["Emagrecer","Ganhar massa","Saúde e disposição","Performance"] },
  { k: "exp", q: "Como é a sua experiência com treino?", o: ["Nunca treinei","Já treinei","Treino há bastante tempo"] },
  { k: "fmt", q: "Como prefere treinar?",            o: ["Presencial","Online","Em dupla","Tanto faz"] },
  { k: "frq", q: "Quantas vezes por semana?",        o: ["2 vezes","3 vezes","4 ou mais"] }
];
const qz = document.getElementById("qz"); const qs = { i: 0, a: {} };
function quiz(){
  if (qs.i < QS.length) {
    const Q = QS[qs.i];
    qz.innerHTML = `<div class="bars">${QS.map((_,n)=>`<i class="${n<=qs.i?"on":""}"></i>`).join("")}</div>
      <p class="qq">${Q.q}</p><div class="qo">${Q.o.map(o=>`<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      ${qs.i>0?`<button class="back" type="button" id="qback">Voltar</button>`:""}`;
    /* trava os botões após o primeiro toque: dois toques rápidos não pulam pergunta */
    qz.querySelectorAll(".qo button").forEach(b => b.onclick = () => {
      qz.querySelectorAll(".qo button").forEach(x => x.disabled = true);
      qs.a[Q.k] = b.dataset.v; qs.i++; setTimeout(quiz, 160);
    });
    const bk = document.getElementById("qback"); if (bk) bk.onclick = () => { qs.i--; quiz(); };
    return;
  }
  const a = qs.a; let id = "comum";
  if (a.fmt === "Online") id = "online";
  else if (a.fmt === "Em dupla") id = "dupla";
  else if (a.frq !== "2 vezes" || a.exp === "Treino há bastante tempo" || a.obj === "Performance") id = "plus";
  const pk = P.pacotes.find(p => p.id === id) || P.pacotes[0];
  const why = { comum: "Você começa com orientação profissional e uma rotina que cabe na sua semana.", plus: "Pela sua frequência e objetivo, um acompanhamento mais próximo acelera a evolução.", online: "Você treina onde estiver, com o plano e o suporte no celular.", dupla: "Treinar junto ajuda na motivação e na constância." }[pk.id] || "";
  const msg = `Olá, ${first}! Fiz as perguntas no seu site. Objetivo: ${a.obj}. Experiência: ${a.exp}. Formato: ${a.fmt}. Frequência: ${a.frq}. A recomendação foi o ${pk.nome}. Pode me passar os valores?`;
  qz.innerHTML = `<div class="bars">${QS.map(()=>`<i class="on"></i>`).join("")}</div><div class="res"><p style="margin-bottom:6px">Seu pacote ideal</p><h3>${esc(pk.nome)}</h3><p>${esc(why)}</p>
    <a class="btn btn-o blk" href="${wa(msg)}">${WA} Pedir valores deste pacote</a></div><button class="back" type="button" id="qredo">Refazer as perguntas</button>`;
  document.getElementById("qredo").onclick = () => { qs.i = 0; qs.a = {}; document.querySelectorAll(".pack").forEach(p => p.classList.remove("rec")); quiz(); };
  document.querySelectorAll(".pack").forEach(p => p.classList.toggle("rec", p.dataset.id === pk.id));
}
quiz();

/* ---------- IMC ---------- */
document.getElementById("calc").addEventListener("click", () => {
  const p = parseFloat(document.getElementById("peso").value), h = parseFloat(document.getElementById("alt").value) / 100;
  const r = document.getElementById("imcRes");
  if (!(p > 20 && p < 400 && h > 1 && h < 2.5)) { r.innerHTML = `<p class="tiny">Informe peso (kg) e altura (cm) válidos.</p>`; return; }
  const v = p / (h*h);
  const c = v < 18.5 ? "Abaixo do peso" : v < 25 ? "Peso adequado" : v < 30 ? "Sobrepeso" : "Obesidade";
  const n = v.toFixed(1).replace(".", ",");
  r.innerHTML = `<div class="imc">${n}</div><p style="margin-bottom:16px">Faixa de referência: <b>${c}</b></p><a class="btn btn-o blk" href="${wa(`Olá, ${first}! Calculei meu IMC no site (${n}). Quero agendar uma avaliação.`)}">${WA} Quero uma avaliação</a>`;
});

/* ---------- movimento (GSAP) ---------- */
function initMotion(){
  const html = document.documentElement, g = window.gsap, ST = window.ScrollTrigger;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!g || !ST || reduce) { html.classList.remove("pre"); return; }
  g.registerPlugin(ST);

  /* abertura: títulos sobem em máscara, foto assenta, o resto aparece */
  html.classList.remove("pre");   /* tira o estado do CSS antes, para o GSAP não somar os dois */
  g.set(".hero .ln>span", { yPercent: 108 });
  g.set(".hero .fx", { opacity: 0, y: 18 });
  g.timeline({ defaults: { ease: "power4.out" } })
    .fromTo(".hero-bg", { scale: 1.14 }, { scale: 1, duration: 2.2, ease: "power2.out" }, 0)
    .to(".hero .ln>span", { yPercent: 0, duration: 1.1, stagger: .12 }, .15)
    .to(".hero .fx", { opacity: 1, y: 0, duration: .8, stagger: .08 }, .75);
  g.to(".hero-bg", { yPercent: 10, ease: "none", scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true } });

  /* números contam ao chegar */
  document.querySelectorAll(".stat b").forEach(el => {
    const n = +el.dataset.n, s = el.dataset.s, o = { v: 0 };
    ST.create({ trigger: el, start: "top 88%", once: true, onEnter: () => { el.textContent = "0" + s; g.to(o, { v: n, duration: 1.4, ease: "power2.out", onUpdate: () => el.textContent = Math.round(o.v) + s }); } });
  });

  /* foto do "sobre" se revela com a rolagem */
  if (document.querySelector(".sobre-pic")) g.fromTo(".sobre-pic", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", ease: "none", scrollTrigger: { trigger: ".sobre-pic", start: "top 90%", end: "top 40%", scrub: true } });

  /* método: cada cartão recua quando o próximo chega */
  const sts = [...document.querySelectorAll(".st")];
  sts.forEach((el, i) => { if (i < sts.length - 1) g.to(el.querySelector(".st-in"), { scale: .94, filter: "brightness(.5)", ease: "none", scrollTrigger: { trigger: sts[i+1], start: "top 85%", end: "top 30%", scrub: true } }); });

  addEventListener("load", () => ST.refresh());
}
document.addEventListener("DOMContentLoaded", initMotion);
</script>
</body>
</html>
